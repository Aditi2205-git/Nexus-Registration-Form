<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexus Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="grid-background"></div>

    <main class="register-wrapper">

        <section class="register-card">

            <div class="brand">

                <span class="brand-line"></span>

                <p>NEXUS // IDENTITY SYSTEM</p>

                <h1>Create Account</h1>

                <span>
                    Register your profile to access the system.
                </span>

            </div>


            <form id="registrationForm">

                <div class="form-row">

                    <div class="field">

                        <label for="fullName">
                            FULL NAME
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your name"
                            required
                        >

                        <small id="nameError"></small>

                    </div>


                    <div class="field">

                        <label for="email">
                            EMAIL ADDRESS
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="name@example.com"
                            required
                        >

                        <small id="emailError"></small>

                    </div>

                </div>


                <div class="field">

                    <label for="phone">
                        PHONE NUMBER
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                        required
                    >

                    <small id="phoneError"></small>

                </div>


                <div class="field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            SHOW
                        </button>

                    </div>

                    <div class="strength">

                        <div
                            id="strengthBar"
                            class="strength-bar"
                        ></div>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter password"
                        required
                    >

                    <small id="confirmError"></small>

                </div>


                <div class="field">

                    <label for="role">
                        PROFILE TYPE
                    </label>

                    <select id="role">

                        <option value="">
                            Select profile type
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="professional">
                            Professional
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <button
                    type="submit"
                    class="register-btn"
                >
                    CREATE ACCOUNT
                </button>


                <div
                    id="successMessage"
                    class="success-message"
                >
                    Account created successfully.
                </div>

            </form>


            <footer>

                <span>SECURE REGISTRATION INTERFACE</span>

                <span>SYSTEM STATUS: ONLINE</span>

            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
